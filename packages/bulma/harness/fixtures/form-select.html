<!--
  Source: https://bulma.io/documentation/form/select/
  Bulma version: 1.0.4
  Fetched: 2026-08-01
  Canonical markup copied verbatim from the docs. The div.select WRAPS a
  native <select>; modifier classes (color, size, is-rounded, is-multiple,
  is-loading) go on the .select wrapper — EXCEPT is-hovered/is-focused which
  go on the native select element itself.
-->

<!-- fixture: basic select (.select > select) -->
<div class="select">
  <select>
    <option>Select dropdown</option>
    <option>With options</option>
  </select>
</div>

<!-- fixture: multiple select (.select.is-multiple + multiple/size attrs on select) -->
<div class="select is-multiple">
  <select multiple size="8">
    <option value="Argentina">Argentina</option>
    <option value="Bolivia">Bolivia</option>
    <option value="Brazil">Brazil</option>
    <option value="Chile">Chile</option>
    <option value="Colombia">Colombia</option>
    <option value="Ecuador">Ecuador</option>
    <option value="Guyana">Guyana</option>

    <option value="Suriname">Suriname</option>
    <option value="Uruguay">Uruguay</option>
    <option value="Venezuela">Venezuela</option>
  </select>
</div>
