<!--
  Source: https://bulma.io/documentation/form/file/
  Bulma version: 1.0.4
  Fetched: 2026-08-01
  Canonical markup copied verbatim from the docs. Full structure:
    div.file > label.file-label > input.file-input[type=file]
      + span.file-cta > span.file-icon + span.file-label
      [+ span.file-name when .has-name]
  NOTE the class collision Bulma itself ships: .file-label is used for BOTH
  the outer <label> wrapper and the inner CTA text <span>. Modifiers
  (has-name, is-right, is-fullwidth, is-boxed, is-centered, colors, sizes)
  all go on the root div.file. The docs' 24 size×style permutations are
  representative repeats; one example per modifier axis is kept below.
-->

<!-- fixture: basic file upload -->
<div class="file">
  <label class="file-label">
    <input class="file-input" type="file" name="resume" />
    <span class="file-cta">
      <span class="file-icon">
        <i class="fas fa-upload"></i>
      </span>
      <span class="file-label"> Choose a file… </span>
    </span>
  </label>
</div>

<!-- fixture: file name display (.has-name + span.file-name) -->

      <span class="file-label"> Choose a file… </span>
    </span>
    <span class="file-name"> Screen Shot 2017-07-29 at 15.54.25.png </span>
  </label>
</div>
