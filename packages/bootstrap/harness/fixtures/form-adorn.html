<!--
  Bootstrap 6 form adorn markup from the pinned v6-dev docs.
  The label is form-control and form-adorn. An empty model does not write a
  value attribute. Vue sets the input property instead.
-->

<!-- fixture: basic -->
<label class="form-control form-adorn">
  <div class="form-adorn-icon" aria-hidden="true"></div>
  <input class="form-ghost" type="text">
</label>

<!-- fixture: end -->
<label class="form-control form-adorn form-adorn-end">

</label>
