<!--
  Bootstrap 6 carousel markup from the pinned v6-dev docs.
  Stacked slides use .carousel.slide. .carousel-fade is the crossfade.
  Prev/next are btn-icon buttons with carousel-icon-prev / carousel-icon-next.
  data-bs-slide and data-bs-ride are not part of this component.
-->

<!-- fixture: basic -->
<div class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">First slide</div>
    <div class="carousel-item">Second slide</div>
  </div>
  <div>
    <button class="btn-icon btn-sm" type="button">
      <span class="carousel-icon-prev" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="btn-icon btn-sm" type="button">
      <span class="carousel-icon-next" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>

<!-- fixture: fade -->
<div class="carousel slide carousel-fade">
  <div class="carousel-inner">
    <div class="carousel-item active">First slide</div>
    <div class="carousel-item">Second slide</div>
  </div>
  <div>
    <button class="btn-icon btn-sm" type="button">
      <span class="carousel-icon-prev" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="btn-icon btn-sm" type="button">
      <span class="carousel-icon-next" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
