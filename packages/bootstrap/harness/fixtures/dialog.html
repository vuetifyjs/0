<!--
  Bootstrap 6 dialog markup from the pinned v6-dev docs.
  data-bs-toggle / data-bs-dismiss are behavior hooks and are not part of the
  rendered contract — this package does not emit them.
-->

<!-- fixture: basic -->
<dialog class="dialog">
  <div class="dialog-header">
    <h1 class="dialog-title">Dialog title</h1>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>
  <div class="dialog-body">
    <p>This is a native dialog element. It uses the browser’s built-in modal behavior for accessibility and focus management.</p>
  </div>
  <div class="dialog-footer">
    <button type="button" class="btn-solid theme-secondary">Close</button>
    <button type="button" class="btn-solid theme-primary">Save changes</button>
  </div>
</dialog>
