<!--
  Bootstrap 6 password strength. data-bs-strength="weak|fair|good|strong"
  is the pin's color. A bare attribute is the bundle's scorer and is not
  part of this component.
-->

<!-- fixture: segments -->
<div class="strength" data-bs-strength="weak">
  <div class="strength-segment active"></div>
  <div class="strength-segment"></div>
  <div class="strength-segment"></div>
  <div class="strength-segment"></div>
</div>

<!-- fixture: bar -->
<div class="strength-bar"></div>
