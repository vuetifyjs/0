<!--
  Bootstrap 6 tooltip markup from the pinned v6-dev docs.
  The plugin adds `bs-tooltip-auto`. Arrow CSS keys off that class plus
  `data-bs-placement`. `data-bs-toggle` is not part of the rendered tip.
-->

<!-- fixture: basic -->
<div class="tooltip bs-tooltip-auto show" role="tooltip" data-bs-placement="top">
  <div class="tooltip-arrow"></div>
  <div class="tooltip-inner">
    Tooltip on top
  </div>
</div>

<!-- fixture: closed -->
<div class="tooltip bs-tooltip-auto" role="tooltip" data-bs-placement="top">
  <div class="tooltip-arrow"></div>
  <div class="tooltip-inner">
    Tooltip on top
  </div>
</div>
