<!--
  Bootstrap 6 popover markup from the pinned v6-dev docs.
  The plugin adds `bs-popover-auto`. Arrow CSS keys off that class plus
  `data-bs-placement`. `data-bs-toggle` is not part of the rendered popover.
-->

<!-- fixture: basic -->
<div class="popover bs-popover-auto show" role="tooltip" data-bs-placement="top">
  <div class="popover-arrow"></div>
  <h3 class="popover-header">Popover title</h3>
  <div class="popover-body">This is the popover content—make it as long as you want.</div>
</div>
