<!--
  Bootstrap 6 radio markup from the pinned v6-dev docs.
  The class is on the input. A group shares one model and a native name.
-->

<!-- fixture: basic -->
<input type="radio" class="radio">

<!-- fixture: checked -->
<input type="radio" class="radio" value="a" checked>

<!-- fixture: sm -->
<input type="radio" class="radio radio-sm">

<!-- fixture: lg -->
<input type="radio" class="radio radio-lg">

<!-- fixture: theme -->
<input type="radio" class="radio theme-primary">

<!-- fixture: disabled -->
<input type="radio" class="radio" disabled>
