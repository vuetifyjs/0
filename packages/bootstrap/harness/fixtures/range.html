<!--
  Bootstrap 6 range. data-bs-bubble is the bundle's value bubble and is not
  part of the rendered contract — the pin has no bubble element.
-->

<!-- fixture: basic -->
<div class="form-range">
  <input type="range" class="form-range-input" min="0" max="100" step="1" value="0" style="--bs-range-fill: 0;">
</div>

<!-- fixture: disabled -->
<div class="form-range">
  <input type="range" class="form-range-input" min="0" max="100" step="1" value="0" style="--bs-range-fill: 0;" disabled>
</div>

<!-- fixture: step -->
<div class="form-range">
  <input type="range" class="form-range-input" min="0" max="5" step="0.5" value="0" style="--bs-range-fill: 0;">
</div>
