name: Nightly Release

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC daily
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'vuetifyjs'
    environment: preview
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        branch: [master, dev]
        include:
          - branch: master
            tag: nightly
          - branch: dev
            tag: nightly-dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Check for recent commits
        id: check-commits
        run: |
          last=$(git show -s --format=%ct HEAD)
          now=$(date +%s)
          diff=$(($now - $last))
          if [ $diff -gt 86400 ]; then
            echo "Last commit was more than 24 hours ago, skipping release"
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup
        if: steps.check-commits.outputs.should-release == 'true'
        uses: ./.github/actions/setup

      # OIDC trusted publishing requires npm >= 11.5.1
      - name: Update npm
        if: steps.check-commits.outputs.should-release == 'true'
        run: npm install -g npm@latest

      - name: Compute nightly version
        if: steps.check-commits.outputs.should-release == 'true'
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./packages/0/package.json').version")
          DATE=$(date +'%Y-%m-%d')
          NIGHTLY_VERSION="${BASE_VERSION}-${{ matrix.branch }}.${DATE}"
          echo "version=${NIGHTLY_VERSION}" >> $GITHUB_OUTPUT
          echo "Nightly version: ${NIGHTLY_VERSION}"

      - name: Safety checks
        if: steps.check-commits.outputs.should-release == 'true'
        env:
          NPM_TAG: ${{ matrix.tag }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Guard: tag must not be empty
          if [ -z "$NPM_TAG" ]; then
            echo "::error::NPM_TAG is empty — aborting to protect latest"
            exit 1
          fi

          # Guard: tag must not be 'latest'
          if [ "$NPM_TAG" = "latest" ]; then
            echo "::error::NPM_TAG is 'latest' — nightlies must never move latest"
            exit 1
          fi

          # Guard: version must contain the prerelease suffix
          if [[ ! "$NIGHTLY_VERSION" =~ -master\. ]] && [[ ! "$NIGHTLY_VERSION" =~ -dev\. ]]; then
            echo "::error::Version '${NIGHTLY_VERSION}' does not contain required prerelease suffix (-master. or -dev.)"
            exit 1
          fi

          echo "Safety checks passed: tag='${NPM_TAG}', version='${NIGHTLY_VERSION}'"

      - name: Bump version in workspace
        if: steps.check-commits.outputs.should-release == 'true'
        run: |
          cd packages/0
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build
        if: steps.check-commits.outputs.should-release == 'true'
        run: pnpm --filter @vuetify/v0 build

      # Rewrite after the build so web-types stay keyed to @vuetify/v0 (alias installs).
      # Workspace-local only. Nightly versions and dist-tags must never land on @vuetify/v0.
      - name: Retarget package name
        if: steps.check-commits.outputs.should-release == 'true'
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs'

          const path = 'packages/0/package.json'
          const pkg = JSON.parse(readFileSync(path, 'utf8'))

          if (pkg.name !== '@vuetify/v0') {
            console.error(`::error::Expected @vuetify/v0 before retarget, found ${pkg.name}`)
            process.exit(1)
          }

          pkg.name = '@vuetify/v0-nightly'
          writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          console.log('Package name is now @vuetify/v0-nightly')
          EOF

      # OIDC cannot create the package name. The first @vuetify/v0-nightly
      # publish is a manual `npm publish`, then a trusted publisher for
      # workflow nightly.yml and environment preview.
      - name: Publish
        if: steps.check-commits.outputs.should-release == 'true'
        env:
          NPM_TAG: ${{ matrix.tag }}
        run: |
          NAME=$(node -p "require('./packages/0/package.json').name")
          if [ "$NAME" != "@vuetify/v0-nightly" ]; then
            echo "::error::Refusing to publish '${NAME}'. Nightlies publish only @vuetify/v0-nightly."
            exit 1
          fi

          if [ -z "$NPM_TAG" ] || [ "$NPM_TAG" = "latest" ]; then
            echo "::error::Refusing tag '${NPM_TAG}'. Nightlies must not move the latest tag."
            exit 1
          fi

          pnpm publish ./packages/0 \
            --no-git-checks \
            --tag "$NPM_TAG" \
            --access public
